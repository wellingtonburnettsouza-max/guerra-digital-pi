<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerra Digital Pi — FPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        /* Visão de fundo do jogo */
        .game-view {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #111 0%, #222 100%);
            position: relative;
        }
        /* Mira no centro */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ffd700;
            pointer-events: none;
        }
        /* Arma em primeira pessoa */
        .weapon {
            position: absolute;
            bottom: 0;
            right: 15%;
            width: 300px;
            height: 200px;
            background: linear-gradient(90deg, #444, #666);
            border-radius: 6px 6px 0 0;
            border: 3px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #ffd700;
            text-align: center;
        }
        /* Interface de armas / loja */
        .shop {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            max-width: 280px;
        }
        .shop h2 {
            color: #ffd700;
            margin-bottom: 12px;
            font-size: 18px;
        }
        .weapon-item {
            background: #222;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .buy-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .buy-btn:hover {
            background: #fff;
        }
        .pi-balance {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.75);
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            font-size: 16px;
        }
        .status {
            position: absolute;
            bottom: 220px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Saldo Pi -->
        <div class="pi-balance">
            💰 Pi: <span id="balance">100</span> π
        </div>

        <!-- Visão do jogo -->
        <div class="game-view">
            <div class="crosshair">+</div>
        </div>

        <!-- Loja de Armas -->
        <div class="shop">
            <h2>Armas Disponíveis</h2>
            <div class="weapon-item">
                <span>Pistola</span>
                <span>15 π</span>
                <button class="buy-btn" onclick="comprar('Pistola', 15)">Comprar</button>
            </div>
            <div class="weapon-item">
                <span>Fuzil</span>
                <span>40 π</span>
                <button class="buy-btn" onclick="comprar('Fuzil', 40)">Comprar</button>
            </div>
            <div class="weapon-item">
                <span>Espingarda</span>
                <span>60 π</span>
                <button class="buy-btn" onclick="comprar('Espingarda', 60)">Comprar</button>
            </div>
            <div class="weapon-item">
                <span>Martelo (Jackhammer)</span>
                <span>80 π</span>
                <button class="buy-btn" onclick="comprar('Martelo', 80)">Comprar</button>
            </div>
        </div>

        <!-- Arma em mão -->
        <div class="weapon" id="armaAtual">
            Nenhuma arma
        </div>

        <!-- Status -->
        <div class="status" id="status">
            Bem-vindo! Compre uma arma para lutar.
        </div>
    </div>

    <script>
        let saldo = 100;
        let armaEquipada = null;

        function atualizarSaldo() {
            document.getElementById('balance').textContent = saldo;
        }

        function comprar(nome, preco) {
            if (saldo >= preco) {
                saldo -= preco;
                armaEquipada = nome;
                atualizarSaldo();
                document.getElementById('armaAtual').textContent = nome;
                document.getElementById('status').textContent = `Você comprou: ${nome} — Pronto para lutar!`;
            } else {
                document.getElementById('status').textContent = 'Saldo insuficiente! Ganhe mais Pi.';
            }
        }
    </script>
</body>
</html>
